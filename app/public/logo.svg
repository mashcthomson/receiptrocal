<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d287" />
    </linearGradient>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0.0" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="95" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle glow halo under receipt -->
  <circle cx="256" cy="240" r="140" fill="url(#glowGrad)" filter="url(#subtleGlow)" />

  <!-- Rail Tracks / Foundation -->
  <g id="rails" stroke="#334155" stroke-width="6" stroke-linecap="round">
    <!-- Horizontal sleeper ties -->
    <line x1="120" y1="416" x2="392" y2="416" stroke="#1e293b" stroke-width="10" />
    <line x1="136" y1="380" x2="376" y2="380" stroke="#1e293b" stroke-width="8" />
    <line x1="152" y1="344" x2="360" y2="344" stroke="#1e293b" stroke-width="6" />

    <!-- Twin perspective rails -->
    <line x1="140" y1="432" x2="200" y2="330" stroke="#00f5a0" stroke-width="5" stroke-opacity="0.6" />
    <line x1="372" y1="432" x2="312" y2="330" stroke="#00f5a0" stroke-width="5" stroke-opacity="0.6" />
  </g>

  <!-- Receipt Body -->
  <g id="receipt" filter="drop-shadow(0px 16px 24px rgba(0,0,0,0.5))">
    <!-- Receipt Paper Background with serrated bottom edge -->
    <path d="M 160 88
             C 160 76, 170 66, 182 66
             L 330 66
             C 342 66, 352 76, 352 88
             L 352 352
             L 336 340
             L 320 352
             L 304 340
             L 288 352
             L 272 340
             L 256 352
             L 240 340
             L 224 352
             L 208 340
             L 192 352
             L 176 340
             L 160 352
             Z"
          fill="#0f172a"
          stroke="#00f5a0"
          stroke-width="3"
          stroke-linejoin="round" />

    <!-- Receipt Header Lines -->
    <line x1="192" y1="110" x2="260" y2="110" stroke="#00f5a0" stroke-width="5" stroke-linecap="round" />
    <circle cx="316" cy="110" r="4" fill="#00f5a0" />

    <!-- Divider dash pattern -->
    <line x1="192" y1="134" x2="320" y2="134" stroke="#334155" stroke-width="3" stroke-dasharray="6,6" stroke-linecap="round" />

    <!-- Invoice Details Lines -->
    <line x1="192" y1="162" x2="280" y2="162" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <line x1="298" y1="162" x2="320" y2="162" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

    <line x1="192" y1="186" x2="250" y2="186" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <line x1="286" y1="186" x2="320" y2="186" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

    <line x1="192" y1="210" x2="234" y2="210" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <line x1="270" y1="210" x2="320" y2="210" stroke="#00f5a0" stroke-width="4" stroke-linecap="round" />

    <!-- Verification Badge / Seal on Receipt -->
    <g transform="translate(256, 268)">
      <circle cx="0" cy="0" r="32" fill="#0a0f1d" stroke="#00f5a0" stroke-width="3" />
      <!-- Checkmark -->
      <path d="M -12 0 L -3 9 L 14 -8" fill="none" stroke="url(#mintGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Wordmark Branding below -->
  <g id="brand-text" text-anchor="middle">
    <text x="256" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="4" fill="#f8fafc">
      RECEIPT<tspan fill="#00f5a0">RAIL</tspan>
    </text>
  </g>
</svg>
